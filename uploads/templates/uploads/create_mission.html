<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Missions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <section class="card shadow-sm mx-auto" style="max-width: 640px;">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2">จัดการ Mission</h1>
                <p class="text-muted">สำหรับผู้ดูแลระบบ: พิมพ์คำสั่งและเวลาส่งงาน ระบบจะสร้างหน้าส่งงานให้ทันที</p>
                <form method="post">
                    {% csrf_token %}
                    <label class="form-label" for="{{ form.command.id_for_label }}">คำสั่ง Mission</label>
                    {{ form.command }}
                    {% if form.command.errors %}
                        <div class="text-danger small mt-2">{{ form.command.errors.0 }}</div>
                    {% endif %}
                    <p class="form-text">ตัวอย่าง: ส่งรูปแมวก่อน 18:21</p>
                    <div class="d-flex gap-2 mt-4">
                        <button class="btn btn-primary" type="submit">สร้าง Mission</button>
                        <a class="btn btn-outline-secondary" href="{% url 'upload_image' %}">กลับ</a>
                    </div>
                </form>

            </div>
        </section>
    </main>
</body>
</html>
